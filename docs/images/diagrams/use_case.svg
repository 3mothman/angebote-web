<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Use case diagram: Unauthenticated User, Customer, Merchant and Admin actors connect to use cases inside the Highbridge system boundary">
  <style>
    text{ font-family:"DM Sans", Arial, sans-serif; fill:#15202b; }
    .uc{ font-size:10.5px; text-anchor:middle; }
    .actor-label{ font-size:10.5px; font-weight:600; text-anchor:middle; }
    .boundary{ fill:none; stroke:#17293F; stroke-width:1.5; }
    .boundary-title{ font-weight:700; font-size:12px; fill:#17293F; }
    .oval{ fill:#ffffff; stroke:#3F7A72; stroke-width:1.4; }
    .stick{ stroke:#17293F; stroke-width:1.6; fill:none; }
    .conn{ stroke:#5b6773; stroke-width:1; }
  </style>

  <rect class="boundary" x="170" y="16" width="650" height="410" rx="10"/>
  <text class="boundary-title" x="190" y="36">Highbridge</text>

  <!-- ovals: (cx,cy) -->
  <g>
    <ellipse class="oval" cx="330" cy="66" rx="90" ry="24"/><text class="uc" x="330" y="70">Register</text>
    <ellipse class="oval" cx="510" cy="66" rx="90" ry="24"/><text class="uc" x="510" y="70">Login</text>
    <ellipse class="oval" cx="690" cy="66" rx="90" ry="24"/><text class="uc" x="690" y="70">View Catalog</text>

    <ellipse class="oval" cx="330" cy="136" rx="90" ry="24"/><text class="uc" x="330" y="140">View Deal Details</text>
    <ellipse class="oval" cx="510" cy="136" rx="90" ry="24"/><text class="uc" x="510" y="140">Write Review</text>
    <ellipse class="oval" cx="690" cy="136" rx="90" ry="24"/><text class="uc" x="690" y="140">Add to Cart</text>

    <ellipse class="oval" cx="330" cy="206" rx="90" ry="24"/><text class="uc" x="330" y="210">View Cart</text>
    <ellipse class="oval" cx="510" cy="206" rx="90" ry="24"/><text class="uc" x="510" y="204">Buy Deals</text><text class="uc" x="510" y="216">in Cart</text>
    <ellipse class="oval" cx="690" cy="206" rx="95" ry="24"/><text class="uc" x="690" y="204">Submit Eligibility</text><text class="uc" x="690" y="216">Proof</text>

    <ellipse class="oval" cx="330" cy="276" rx="90" ry="24"/><text class="uc" x="330" y="280">View My Deals</text>
    <ellipse class="oval" cx="510" cy="276" rx="90" ry="24"/><text class="uc" x="510" y="280">Submit New Deal</text>
    <ellipse class="oval" cx="690" cy="276" rx="90" ry="24"/><text class="uc" x="690" y="280">Redeem Voucher</text>

    <ellipse class="oval" cx="330" cy="346" rx="95" ry="24"/><text class="uc" x="330" y="350">Review Eligibility</text>
    <ellipse class="oval" cx="510" cy="346" rx="90" ry="24"/><text class="uc" x="510" y="344">Review /</text><text class="uc" x="510" y="356">Publish Deal</text>
    <ellipse class="oval" cx="690" cy="346" rx="95" ry="24"/><text class="uc" x="690" y="344">View Impact</text><text class="uc" x="690" y="356">Dashboard</text>
  </g>

  <!-- actors: simple stick figures -->
  <g>
    <!-- Unauthenticated User -->
    <circle class="stick" cx="60" cy="56" r="10"/>
    <line class="stick" x1="60" y1="66" x2="60" y2="100"/>
    <line class="stick" x1="40" y1="80" x2="80" y2="80"/>
    <line class="stick" x1="60" y1="100" x2="44" y2="122"/>
    <line class="stick" x1="60" y1="100" x2="76" y2="122"/>
    <text class="actor-label" x="60" y="140">Unauthenticated</text>
    <text class="actor-label" x="60" y="153">User</text>

    <!-- Customer -->
    <circle class="stick" cx="60" cy="196" r="10"/>
    <line class="stick" x1="60" y1="206" x2="60" y2="240"/>
    <line class="stick" x1="40" y1="220" x2="80" y2="220"/>
    <line class="stick" x1="60" y1="240" x2="44" y2="262"/>
    <line class="stick" x1="60" y1="240" x2="76" y2="262"/>
    <text class="actor-label" x="60" y="282">Customer</text>

    <!-- Merchant -->
    <circle class="stick" cx="60" cy="326" r="10"/>
    <line class="stick" x1="60" y1="336" x2="60" y2="370"/>
    <line class="stick" x1="40" y1="350" x2="80" y2="350"/>
    <line class="stick" x1="60" y1="370" x2="44" y2="392"/>
    <line class="stick" x1="60" y1="370" x2="76" y2="392"/>
    <text class="actor-label" x="60" y="412">Merchant</text>

    <!-- Admin -->
    <circle class="stick" cx="940" cy="196" r="10"/>
    <line class="stick" x1="940" y1="206" x2="940" y2="240"/>
    <line class="stick" x1="920" y1="220" x2="960" y2="220"/>
    <line class="stick" x1="940" y1="240" x2="924" y2="262"/>
    <line class="stick" x1="940" y1="240" x2="956" y2="262"/>
    <text class="actor-label" x="940" y="282">Admin</text>
  </g>

  <!-- connections -->
  <g class="conn">
    <line x1="90" y1="70" x2="240" y2="66"/>
    <line x1="90" y1="75" x2="420" y2="66"/>
    <line x1="90" y1="80" x2="600" y2="66"/>
    <line x1="90" y1="85" x2="240" y2="136"/>
    <line x1="90" y1="130" x2="420" y2="136"/>

    <line x1="90" y1="200" x2="600" y2="136"/>
    <line x1="90" y1="205" x2="240" y2="206"/>
    <line x1="90" y1="210" x2="420" y2="206"/>
    <line x1="90" y1="215" x2="595" y2="206"/>
    <line x1="90" y1="220" x2="240" y2="276"/>

    <line x1="90" y1="330" x2="420" y2="276"/>
    <line x1="90" y1="335" x2="600" y2="276"/>
    <line x1="90" y1="340" x2="245" y2="280"/>

    <line x1="910" y1="200" x2="425" y2="346"/>
    <line x1="910" y1="210" x2="600" y2="346"/>
    <line x1="910" y1="220" x2="785" y2="276"/>
    <line x1="910" y1="230" x2="785" y2="346"/>
  </g>
</svg>
