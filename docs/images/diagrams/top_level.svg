<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Top-level architecture: the angebot theme renders through shortcodes and hooks into the angebot-deals plugin's five module groups, which sync into WooCommerce and read and write the MySQL database">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#17293F"/>
    </marker>
  </defs>
  <style>
    text{ font-family:"DM Sans", Arial, sans-serif; fill:#15202b; }
    .title{ font-weight:700; font-size:13px; }
    .sub{ font-size:10px; fill:#5b6773; }
    .label{ font-size:10px; fill:#3F7A72; font-weight:600; }
    .theme{ fill:#eef2f6; stroke:#17293F; stroke-width:1.5; }
    .plugin{ fill:none; stroke:#17293F; stroke-width:1.5; stroke-dasharray:4 3; }
    .module{ fill:#ffffff; stroke:#3F7A72; stroke-width:1.5; }
    .wc{ fill:#f4efe8; stroke:#17293F; stroke-width:1.5; }
    .db{ fill:#17293F; }
  </style>

  <!-- theme -->
  <rect class="theme" x="330" y="20" width="240" height="60" rx="8"/>
  <text class="title" x="450" y="45" text-anchor="middle">Theme: angebot</text>
  <text class="sub" x="450" y="62" text-anchor="middle">header, footer, page templates</text>

  <line x1="450" y1="80" x2="450" y2="112" marker-end="url(#arrow2)" stroke="#17293F" stroke-width="1.5"/>
  <text class="label" x="465" y="100">shortcodes / template tags</text>

  <!-- plugin boundary -->
  <rect class="plugin" x="40" y="112" width="820" height="230" rx="10"/>
  <text class="sub" x="60" y="132" style="font-weight:700; fill:#17293F">Plugin: angebot-deals</text>

  <!-- five module boxes -->
  <rect class="module" x="60" y="150" width="150" height="70" rx="6"/>
  <text class="title" x="135" y="175" text-anchor="middle" style="font-size:11.5px">Catalogue</text>
  <text class="sub" x="135" y="190" text-anchor="middle">Deal_CPT</text>
  <text class="sub" x="135" y="203" text-anchor="middle">Deal_Meta</text>

  <rect class="module" x="230" y="150" width="150" height="70" rx="6"/>
  <text class="title" x="305" y="175" text-anchor="middle" style="font-size:11.5px">Membership &amp;</text>
  <text class="title" x="305" y="190" text-anchor="middle" style="font-size:11.5px">Eligibility</text>
  <text class="sub" x="305" y="205" text-anchor="middle">Membership, Eligibility</text>

  <rect class="module" x="400" y="150" width="150" height="70" rx="6"/>
  <text class="title" x="475" y="175" text-anchor="middle" style="font-size:11.5px">Commerce &amp;</text>
  <text class="title" x="475" y="190" text-anchor="middle" style="font-size:11.5px">Vouchers</text>
  <text class="sub" x="475" y="205" text-anchor="middle">Voucher, QR_Code</text>

  <rect class="module" x="570" y="150" width="140" height="70" rx="6"/>
  <text class="title" x="640" y="175" text-anchor="middle" style="font-size:11.5px">Merchant</text>
  <text class="sub" x="640" y="190" text-anchor="middle">Merchant_Role</text>
  <text class="sub" x="640" y="203" text-anchor="middle">Merchant_Portal</text>

  <rect class="module" x="720" y="150" width="120" height="70" rx="6"/>
  <text class="title" x="780" y="175" text-anchor="middle" style="font-size:11.5px">Front-end</text>
  <text class="sub" x="780" y="190" text-anchor="middle">Shortcodes</text>
  <text class="sub" x="780" y="203" text-anchor="middle">Reviews, Impact</text>

  <text class="sub" x="450" y="330" text-anchor="middle">WooCommerce_Sync mirrors each Deal into a hidden WC_Product</text>

  <!-- WooCommerce -->
  <rect class="wc" x="300" y="380" width="300" height="60" rx="8"/>
  <text class="title" x="450" y="405" text-anchor="middle">WooCommerce core</text>
  <text class="sub" x="450" y="422" text-anchor="middle">cart, checkout, orders, products</text>

  <!-- DB -->
  <rect class="db" x="350" y="490" width="200" height="50" rx="8"/>
  <text class="title" x="450" y="520" text-anchor="middle" style="fill:#ffffff">MySQL</text>

  <line x1="450" y1="342" x2="450" y2="378" marker-end="url(#arrow2)" stroke="#17293F" stroke-width="1.5"/>
  <text class="label" x="465" y="365">sync product/stock</text>

  <line x1="450" y1="440" x2="450" y2="488" marker-end="url(#arrow2)" stroke="#17293F" stroke-width="1.5"/>
  <text class="label" x="465" y="470">wp_posts, wp_postmeta</text>

  <line x1="230" y1="342" x2="380" y2="490" marker-end="url(#arrow2)" stroke="#17293F" stroke-width="1.5"/>
  <text class="label" x="150" y="460">wp_angebot_* tables, user meta</text>
</svg>
